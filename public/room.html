<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Paseo session</title>
<style>
:root{color-scheme:light dark;--surface-0:#fff;--surface-1:#fafafa;--surface-2:#f4f4f5;--text:#1a1a1e;--text-muted:#71717a;--text-extra-muted:#a1a1aa;--border:#e4e4e7;--accent:#20744a;--accent-bright:#239956;--danger:#b04138}
@media(prefers-color-scheme:dark){:root{--surface-0:#181b1a;--surface-1:#1e2120;--surface-2:#272a29;--text:#fafafa;--text-muted:#a1a5a4;--text-extra-muted:#717574;--border:#252b2a;--accent-bright:#7ccba0;--danger:#c64f43}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;background:var(--surface-0);color:var(--text)}body{font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.app{min-width:0;min-height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px}
#room-header,#composer{border-color:var(--border);background:var(--surface-0)}#room-header{position:sticky;top:0;z-index:2;border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}.header,.conversation,.composer-inner{width:min(calc(100% - 32px),760px);margin:auto}.header{min-height:52px;display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--accent);color:white;font-size:12px;font-weight:700}.title-wrap{min-width:0;flex:1}h1{overflow:hidden;margin:0;font-size:14px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}#status{overflow:hidden;color:var(--text-muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}#live{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:12px;white-space:nowrap}#live.live{color:var(--accent)}#live.reconnecting{color:var(--danger)}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
main{min-height:0}#room-error{display:none;width:min(100% - 32px,440px);margin:96px auto;padding:24px;border:1px solid var(--border);border-radius:8px;background:var(--surface-1);text-align:center}#room-error h2{margin:0 0 8px;font-size:17px}#room-error p{margin:0;color:var(--text-muted)}#timeline{height:100%;overflow-y:auto}.conversation{display:flex;min-height:100%;flex-direction:column;gap:20px;padding:32px 0 24px}.message{max-width:min(100%,680px);overflow-wrap:anywhere}.user-message{align-self:flex-end;min-width:120px;padding:10px 12px;border-radius:10px 10px 3px;background:var(--surface-2)}.assistant-message{width:100%;align-self:flex-start}.author{display:block;margin-bottom:3px;color:var(--text-muted);font-size:12px;font-weight:600}.markdown>:first-child{margin-top:0}.markdown>:last-child{margin-bottom:0}.markdown p{margin:0 0 12px;white-space:pre-wrap}.markdown h2,.markdown h3{margin:20px 0 8px;font-size:16px}.markdown ul,.markdown ol{margin:0 0 12px;padding-left:24px}.markdown li{margin:3px 0}.markdown code{padding:1px 4px;border-radius:4px;background:var(--surface-2);font:.9em ui-monospace,SFMono-Regular,Menlo,monospace}.markdown a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.activity{width:100%;padding-left:12px;border-left:2px solid var(--border);color:var(--text-muted);font-size:12px}.activity-label{display:flex;align-items:center;gap:7px;min-height:20px}.activity-icon{color:var(--text-extra-muted)}details.work-detail{margin:0;color:var(--text-muted)}details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}details summary:before{display:inline-block;margin-right:7px;color:var(--text-extra-muted);content:"›";transition:transform .15s ease}details[open] summary:before{transform:rotate(90deg)}.detail{margin:8px 0 0 16px;white-space:pre-wrap}.todo{display:grid;gap:5px;margin:8px 0 0 16px}.todo .done{color:var(--text-extra-muted);text-decoration:line-through}.error{color:var(--danger)}
.question{padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--surface-1)}.question h2{margin:0 0 4px;font-size:14px}.question p{margin:0;color:var(--text-muted);font-size:13px}.question-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.question-actions button{min-height:34px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface-0);color:var(--text);font-size:13px}.question-actions button:first-child{border-color:var(--accent);background:var(--accent);color:white}
#working{display:none;align-items:center;gap:8px;margin:0 auto;color:var(--text-muted);font-size:12px}#working.visible{display:flex}.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}#new-messages{position:fixed;right:24px;bottom:104px;display:none;padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface-0);color:var(--text);font-size:12px;box-shadow:0 1px 2px rgb(0 0 0/.1)}#new-messages.visible{display:block}
#composer{position:sticky;bottom:0;border-top:1px solid var(--border)}.composer-inner{padding:12px 0 max(12px,env(safe-area-inset-bottom))}#send-error{display:none;margin:0 0 8px;color:var(--danger);font-size:12px}#send-error.visible{display:block}.fields{display:flex;align-items:flex-end;gap:8px}#name,#message{border:1px solid var(--border);border-radius:6px;background:var(--surface-0);color:var(--text)}#name{width:116px;min-height:38px;padding:8px}#message{flex:1;min-height:38px;max-height:160px;padding:8px 10px;resize:none;line-height:20px}#send{min-width:64px;min-height:38px;padding:8px 12px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:white;font-size:14px;font-weight:600}#send:hover:not(:disabled){border-color:var(--accent-bright);background:var(--accent-bright)}#send:disabled{cursor:not-allowed;opacity:.55}.help{margin:5px 0 0 124px;color:var(--text-extra-muted);font-size:11px}
@media(max-width:700px){.header,.conversation,.composer-inner{width:min(calc(100% - 24px),760px)}.conversation{gap:16px;padding-top:20px}#status{display:none}.fields{display:grid;grid-template-columns:1fr auto}#name{grid-column:1/-1;width:100%}.help{margin-left:0}#new-messages{right:12px;bottom:144px}}
</style></head>
<body><div class="app">
<header id="room-header"><div class="header"><div class="mark" aria-hidden="true">P</div><div class="title-wrap"><h1 id="title">Shared session</h1><div id="status"></div></div><span id="live" aria-live="polite"><i class="dot" aria-hidden="true"></i><span>connecting…</span></span></div></header>
<main aria-busy="true"><div id="room-error"><h2>Invalid or expired share link</h2><p>Ask the host for a new link.</p></div><div id="timeline"><div class="conversation" aria-live="polite" aria-relevant="additions"></div></div><button id="new-messages" type="button">New messages ↓</button></main>
<div id="working"><i class="pulse"></i>Agent is working…</div>
<form id="composer" aria-label="Send a message"><div class="composer-inner"><div id="send-error" role="alert"></div><div class="fields"><input id="name" placeholder="Your name" autocomplete="name" aria-label="Your name"><textarea id="message" rows="1" placeholder="Message the agent…" aria-label="Message the agent"></textarea><button id="send" type="submit">Send</button></div><p class="help">Enter to send · Shift + Enter for a new line</p></div></form>
</div><script>
const token=location.pathname.split("/").filter(Boolean)[1],$=id=>document.getElementById(id),timeline=$("timeline"),conversation=timeline.firstElementChild,main=document.querySelector("main"),name=$("name"),message=$("message"),send=$("send");
name.value=localStorage.getItem("paseo-rooms-name")||"";name.onchange=()=>localStorage.setItem("paseo-rooms-name",name.value.trim());
let openAssistant=null,openReasoning=null,retry=1000,reconnect=null,roomQuestions=[];
const atBottom=()=>timeline.scrollHeight-timeline.scrollTop-timeline.clientHeight<64;
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function append(node){const stick=atBottom();conversation.append(node);if(stick)timeline.scrollTop=timeline.scrollHeight;else $("new-messages").classList.add("visible")}
$("new-messages").onclick=()=>{timeline.scrollTop=timeline.scrollHeight;$("new-messages").classList.remove("visible")};timeline.onscroll=()=>{if(atBottom())$("new-messages").classList.remove("visible")};
function closeStreams(){openAssistant=null;openReasoning=null}
function inline(parent,text){for(const bit of String(text).split(/(\x60[^\x60]+\x60|\*\*[^*]+\*\*|\[[^\]]+\]\([^\s)]+\))/g)){if(/^\x60[^\x60]+\x60$/.test(bit))parent.append(el("code","",bit.slice(1,-1)));else if(/^\*\*[^*]+\*\*$/.test(bit))parent.append(el("strong","",bit.slice(2,-2)));else{const link=bit.match(/^\[([^\]]+)\]\(([^\s)]+)\)$/);if(link){let url;try{url=new URL(link[2],location.href)}catch{}if(url&&["https:","http:","mailto:"].includes(url.protocol)){const a=el("a","",link[1]);a.href=url;a.target="_blank";a.rel="noopener noreferrer";parent.append(a)}else parent.append(bit)}else parent.append(bit)}}}
function markdown(text){const root=el("div","markdown"),lines=String(text).split("\n");let i=0;while(i<lines.length){const h=lines[i].match(/^(#{1,3})\s+(.+)$/);if(h){const node=el(h[1].length===1?"h2":"h3");inline(node,h[2]);root.append(node);i++;continue}const entry=lines[i].match(/^\s*([-*]|\d+\.)\s+(.+)$/);if(entry){const ordered=/\d+\./.test(entry[1]),list=el(ordered?"ol":"ul");while(i<lines.length){const item=lines[i].match(/^\s*([-*]|\d+\.)\s+(.+)$/);if(!item||/\d+\./.test(item[1])!==ordered)break;const li=el("li");inline(li,item[2]);list.append(li);i++}root.append(list);continue}const body=[];while(i<lines.length&&lines[i]!==""&&!/^(#{1,3})\s+/.test(lines[i])&&!/^\s*([-*]|\d+\.)\s+/.test(lines[i]))body.push(lines[i++]);if(body.length){const p=el("p");inline(p,body.join("\n"));root.append(p)}else i++}return root}
function activity(label,detail,kind){const row=el("div","activity "+(kind||"")),line=el("div","activity-label");line.append(el("span","activity-icon","◌"),el("span","",label));row.append(line);if(detail){const fold=el("details","work-detail");fold.append(el("summary","","Details"),el("div","detail",detail));row.append(fold)}append(row);return row}
function user(text){closeStreams();const match=String(text).match(/^\[([^\]\n]{1,40})\]\n([\s\S]*)$/),node=el("article","message user-message");node.append(el("span","author",match?match[1]:"Host"),markdown(match?match[2]:text));append(node)}
function assistant(text){if(!openAssistant){openAssistant=el("article","message assistant-message");openAssistant.append(markdown(""));append(openAssistant)}const content=openAssistant.querySelector(".markdown"),raw=(content.dataset.raw||"")+String(text);content.dataset.raw=raw;content.replaceChildren(markdown(raw));openReasoning=null}
function reasoning(text){if(!openReasoning){openReasoning=el("details","activity work-detail");openReasoning.append(el("summary","","Thinking"),el("div","detail"));append(openReasoning)}openReasoning.querySelector(".detail").textContent+=String(text);openAssistant=null}
function todo(items){closeStreams();const row=activity("Plan"),list=el("div","todo");for(const value of Array.isArray(items)?items:[]){const done=value.completed||value.status==="completed";list.append(el("div",done?"done":"",""+(done?"✓":"○")+" "+(value.text||"Untitled task")))}row.append(list)}
function question(value){if(!value||!value.id||!Array.isArray(value.actions)||conversation.querySelector("[data-question-id='"+CSS.escape(value.id)+"']"))return;const card=el("section","question");card.dataset.questionId=value.id;card.append(el("h2","",value.title||"The agent has a question"));if(value.description)card.append(el("p","",value.description));const actions=el("div","question-actions");for(const action of value.actions){const button=el("button","",action.label||"Choose");button.type="button";button.onclick=async()=>{for(const node of actions.querySelectorAll("button"))node.disabled=true;const res=await fetch("/api/rooms/"+token+"/questions/"+encodeURIComponent(value.id)+"/respond",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({actionId:action.id})}).catch(()=>null);if(res&&res.ok)card.replaceChildren(el("p","","Response sent."));else{for(const node of actions.querySelectorAll("button"))node.disabled=false;sendError("That choice could not be sent. Please try again.")}};actions.append(button)}card.append(actions);append(card)}
function item(value){if(!value||typeof value!=="object")return;switch(value.type){case"user_message":user(value.text||"");break;case"assistant_message":assistant(value.text||"");break;case"reasoning":reasoning(value.text||"");break;case"tool_call":closeStreams();activity((value.name||"Tool")+" · "+(value.status||"working"));break;case"todo":todo(value.items);break;case"error":closeStreams();activity(value.message||"Agent error","","error");break;default:closeStreams();activity("Agent activity")}}
function working(visible){$("working").classList.toggle("visible",visible)}
function stream(event){if(!event||typeof event!=="object")return;switch(event.type){case"timeline":item(event.item);break;case"turn_started":working(true);break;case"turn_completed":working(false);closeStreams();break;case"turn_canceled":working(false);closeStreams();activity("Turn canceled");break;case"turn_failed":working(false);closeStreams();activity(event.error||"Turn failed","","error");break;case"permission_requested":closeStreams();if(event.request&&event.request.kind==="question")question(event.request);else activity("The agent needs the host to respond in Paseo");break;case"permission_resolved":if(event.requestId)conversation.querySelector("[data-question-id='"+CSS.escape(event.requestId)+"']")?.remove();break}}
function live(state,label){const node=$("live");node.className=state;node.lastElementChild.textContent=label}function sendError(text){const node=$("send-error");node.textContent=text;node.classList.toggle("visible",!!text)}function resize(){message.style.height="auto";message.style.height=Math.min(message.scrollHeight,160)+"px"}message.oninput=resize;
async function loadRoom(){const res=await fetch("/api/rooms/"+token);if(!res.ok){$("room-error").style.display="block";timeline.style.display="none";$("composer").style.display="none";main.setAttribute("aria-busy","false");return false}const room=await res.json();$("title").textContent=room.label||"Shared session";if(room.agent){$("status").textContent=[room.agent.provider,room.agent.status].filter(Boolean).join(" · ");working(room.agent.status==="running")}roomQuestions=Array.isArray(room.questions)?room.questions:[];main.setAttribute("aria-busy","false");return true}
async function history(){const stick=atBottom();if(!await loadRoom())return;const res=await fetch("/api/rooms/"+token+"/history");if(!res.ok)return;const data=await res.json();conversation.replaceChildren();closeStreams();for(const entry of Array.isArray(data.entries)?data.entries:[]){item(entry.item);closeStreams()}for(const value of roomQuestions)question(value);if(stick)timeline.scrollTop=timeline.scrollHeight}
function connect(){const protocol=location.protocol==="https:"?"wss":"ws",socket=new WebSocket(protocol+"://"+location.host+"/api/rooms/"+token+"/ws");socket.onopen=()=>{retry=1000;live("live","live");history()};socket.onmessage=message=>{try{const frame=JSON.parse(message.data);if(frame.type==="stream")stream(frame.event)}catch{activity("Received an unreadable live update","","error")}};socket.onclose=()=>{live("reconnecting","reconnecting…");clearTimeout(reconnect);reconnect=setTimeout(connect,retry);retry=Math.min(retry*2,15000)};socket.onerror=()=>socket.close()}
$("composer").onsubmit=async event=>{event.preventDefault();const text=message.value.trim(),display=name.value.trim();if(!text)return;if(!display){sendError("Add a display name before sending.");name.focus();return}sendError("");send.disabled=true;try{const res=await fetch("/api/rooms/"+token+"/messages",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({message:text,name:display})});if(!res.ok){const body=await res.json().catch(()=>null);throw Error(body?.error==="rate limit exceeded"?"You have sent several messages; please try again in a minute.":"Your message could not be sent. Please try again.")}message.value="";resize()}catch(error){sendError(error instanceof Error?error.message:"Your message could not be sent.");message.focus()}finally{send.disabled=false}};
message.onkeydown=event=>{if(event.key==="Enter"&&!event.shiftKey&&!event.isComposing){event.preventDefault();$("composer").requestSubmit()}};
loadRoom().then(ok=>{if(ok){history();connect()}}).catch(()=>{$("room-error").style.display="block";timeline.style.display="none";$("composer").style.display="none";main.setAttribute("aria-busy","false")});
</script></body></html>
