<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Paseo session</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif; margin: 0;
    display: flex; flex-direction: column; height: 100dvh;
    background: Canvas; color: CanvasText;
  }
  header {
    padding: 0.6rem 1rem; border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
    display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap;
  }
  header h1 { font-size: 1rem; margin: 0; }
  #status { font-size: 0.8rem; opacity: 0.7; }
  #live { font-size: 0.8rem; }
  #timeline { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .msg { max-width: 46rem; padding: 0.5rem 0.75rem; border-radius: 0.6rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: color-mix(in srgb, royalblue 25%, Canvas); }
  .assistant { align-self: flex-start; background: color-mix(in srgb, CanvasText 8%, Canvas); }
  .meta { align-self: flex-start; font-size: 0.78rem; opacity: 0.65; padding: 0 0.25rem; }
  .author { font-size: 0.72rem; font-weight: 600; opacity: 0.8; display: block; margin-bottom: 0.15rem; }
  .reasoning { font-style: italic; opacity: 0.55; font-size: 0.85rem; }
  #working { display: none; padding: 0 1rem 0.5rem; font-size: 0.85rem; opacity: 0.7; }
  form { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  input, textarea, button { font: inherit; }
  #name { width: 8rem; padding: 0.5rem; border-radius: 0.4rem; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: Canvas; color: inherit; }
  #message { flex: 1; padding: 0.5rem; border-radius: 0.4rem; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: Canvas; color: inherit; resize: none; }
  button { padding: 0.5rem 1rem; border-radius: 0.4rem; border: none; background: royalblue; color: white; cursor: pointer; }
  #error { display: none; margin: auto; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1 id="title">Shared session</h1>
    <span id="status"></span>
    <span id="live"></span>
  </header>
  <div id="error"><h2>Invalid or expired share link</h2><p>Ask the host for a new link.</p></div>
  <div id="timeline"></div>
  <div id="working">agent is working…</div>
  <form id="form">
    <input id="name" placeholder="Your name" autocomplete="off">
    <textarea id="message" rows="1" placeholder="Message the agent…"></textarea>
    <button type="submit">Send</button>
  </form>
  <script>
/* Shared-room chat client. Renders the Paseo timeline: history from the REST
   endpoint, then live agent_stream events over the room WebSocket. */

const token = location.pathname.split("/").filter(Boolean)[1];
const $ = (id) => document.getElementById(id);
const timelineEl = $("timeline");

const nameInput = $("name");
nameInput.value = localStorage.getItem("paseo-rooms-name") || "";
nameInput.addEventListener("change", () => localStorage.setItem("paseo-rooms-name", nameInput.value));

let openAssistant = null; // current streaming assistant bubble
let openReasoning = null;

function scrolledToBottom() {
  return timelineEl.scrollHeight - timelineEl.scrollTop - timelineEl.clientHeight < 60;
}
function append(el) {
  const stick = scrolledToBottom();
  timelineEl.appendChild(el);
  if (stick) timelineEl.scrollTop = timelineEl.scrollHeight;
}

function bubble(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  append(div);
  return div;
}

function metaLine(text) {
  const div = document.createElement("div");
  div.className = "meta";
  div.textContent = text;
  append(div);
  return div;
}

function closeStreams() {
  openAssistant = null;
  openReasoning = null;
}

function renderUserMessage(text) {
  closeStreams();
  // Attribution convention: messages sent through a room are "[Name]\n<text>".
  const match = text.match(/^\[([^\]\n]{1,40})\]\n([\s\S]*)$/);
  const div = bubble("user", match ? match[2] : text);
  const author = document.createElement("span");
  author.className = "author";
  author.textContent = match ? match[1] : "host";
  div.prepend(author);
}

function renderItem(item) {
  switch (item.type) {
    case "user_message":
      renderUserMessage(item.text);
      break;
    case "assistant_message":
      // Live assistant output arrives in pieces; concatenate into one bubble.
      if (!openAssistant) openAssistant = bubble("assistant", "");
      openAssistant.textContent += item.text;
      openReasoning = null;
      break;
    case "reasoning":
      if (!openReasoning) openReasoning = bubble("assistant reasoning", "");
      openReasoning.textContent += item.text;
      openAssistant = null;
      break;
    case "tool_call":
      closeStreams();
      metaLine(`⚙ ${item.name} — ${item.status}`);
      break;
    case "todo": {
      closeStreams();
      const lines = (item.items || []).map(
        (t) => `${t.completed || t.status === "completed" ? "☑" : "☐"} ${t.text}`,
      );
      metaLine(lines.join("\n"));
      break;
    }
    default:
      break;
  }
}

function renderStreamEvent(event) {
  switch (event.type) {
    case "timeline":
      renderItem(event.item);
      break;
    case "turn_started":
      $("working").style.display = "block";
      break;
    case "turn_completed":
    case "turn_failed":
    case "turn_canceled":
      $("working").style.display = "none";
      closeStreams();
      if (event.type === "turn_failed") metaLine(`✗ turn failed: ${event.error}`);
      break;
    case "permission_requested":
      metaLine("⚠ the agent is asking for permission — the host must respond in Paseo");
      break;
    default:
      break;
  }
}

async function loadRoom() {
  const res = await fetch(`/api/rooms/${token}`);
  if (!res.ok) {
    $("error").style.display = "block";
    timelineEl.style.display = "none";
    $("form").style.display = "none";
    $("working").style.display = "none";
    return false;
  }
  const room = await res.json();
  $("title").textContent = room.label || "Shared session";
  if (room.agent) {
    $("status").textContent = `${room.agent.provider ?? ""} · ${room.agent.status ?? ""}`;
    if (room.agent.status === "running") $("working").style.display = "block";
  }
  return true;
}

async function loadHistory() {
  const res = await fetch(`/api/rooms/${token}/history`);
  if (!res.ok) return;
  const { entries } = await res.json();
  timelineEl.replaceChildren();
  closeStreams();
  for (const entry of entries) {
    renderItem(entry.item);
    closeStreams(); // history entries are already merged; one bubble per entry
  }
  timelineEl.scrollTop = timelineEl.scrollHeight;
}

function connectLive() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/api/rooms/${token}/ws`);
  ws.onopen = () => {
    $("live").textContent = "● live";
    $("live").style.color = "seagreen";
    // Re-sync: anything that streamed while we were disconnected is in history.
    loadHistory();
  };
  ws.onmessage = (msg) => {
    const frame = JSON.parse(msg.data);
    if (frame.type === "stream") renderStreamEvent(frame.event);
  };
  ws.onclose = () => {
    $("live").textContent = "○ reconnecting…";
    $("live").style.color = "darkorange";
    setTimeout(connectLive, 1500);
  };
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = $("message").value.trim();
  const name = nameInput.value.trim();
  if (!message) return;
  if (!name) {
    nameInput.focus();
    return;
  }
  $("message").value = "";
  const res = await fetch(`/api/rooms/${token}/messages`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ message, name }),
  });
  if (!res.ok) metaLine("✗ failed to send message");
  // No local echo: the message comes back through the shared timeline stream.
});

$("message").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});

loadRoom().then((ok) => {
  if (ok) connectLive();
});

  </script>
</body>
</html>
