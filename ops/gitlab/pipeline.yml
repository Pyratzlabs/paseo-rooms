spec:
  inputs:
    github_sha:
      type: string
      regex: "^[a-f0-9]{40}$"
    github_run_id:
      type: string
      regex: "^[1-9][0-9]{0,14}$"
    dry_run:
      type: string
      options: ["true", "false"]
      default: "true"
---
# Project setting ci_pipeline_variables_minimum_override_role MUST be no_one_allowed.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

stages: [build, deploy]

default:
  image: node:22-alpine
  tags: [paseo-rooms]

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "1"
  RELEASE_SHA: $[[ inputs.github_sha ]]
  RELEASE_RUN_ID: $[[ inputs.github_run_id ]]
  DEPLOY_DRY_RUN: $[[ inputs.dry_run ]]

build-release:
  stage: build
  timeout: 15m
  before_script:
    - apk add --no-cache git
  script:
    - node ops/gitlab/build.mjs
  artifacts:
    paths: [release-artifact/]
    expire_in: 1 day

deploy-relay:
  stage: deploy
  needs: [build-release]
  resource_group: paseo-rooms-production
  environment: production
  interruptible: false
  timeout: 20m
  variables:
    RUNNER_SCRIPT_TIMEOUT: 16m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 3m
  before_script:
    - apk add --no-cache git openssh-client rsync python3
  script:
    - node ops/gitlab/deploy.mjs
  after_script:
    - if [ "$CI_JOB_STATUS" != "success" ]; then node ops/gitlab/deploy.mjs --recover; fi
