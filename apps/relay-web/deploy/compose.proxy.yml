# Public deployment behind the host's existing nginx-proxy + acme-companion
# (network "web"): TLS is automatic via VIRTUAL_HOST/LETSENCRYPT_HOST. Used by
# CI when ROOMS_DOMAIN is set; compose.lan.yml remains for proxy-less hosts.
#
#   RELAY_TRUSTED_PROXY_ADDRESSES=<nginx-private-ip> \
#     RELAY_AUTH_MODE=open ROOMS_DOMAIN=paseo-rooms.example.com \
#     docker compose -f compose.proxy.yml up -d
#
# Laptop side then dials: RELAY_URL=wss://$ROOMS_DOMAIN/host
# Private relays use RELAY_AUTH_MODE=key and supply RELAY_KEY.
# Publish :8080 on loopback only for local health checks; public access uses TLS.
# Direct LAN/ZeroTier access belongs in the separate compose.lan.yml stack.
services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    environment:
      RELAY_AUTH_MODE: ${RELAY_AUTH_MODE:-key}
      RELAY_KEY: ${RELAY_KEY:-}
      RELAY_PORT: "8080"
      RELAY_TRUSTED_PROXY_ADDRESSES: ${RELAY_TRUSTED_PROXY_ADDRESSES:?Set the exact immediate proxy IP addresses}
      RELAY_MAX_HOSTS: ${RELAY_MAX_HOSTS-256}
      RELAY_MAX_HOSTS_PER_SOURCE: ${RELAY_MAX_HOSTS_PER_SOURCE-32}
      VIRTUAL_HOST: ${ROOMS_DOMAIN:?ROOMS_DOMAIN is required}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${ROOMS_DOMAIN}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true
