# LAN/testing deployment: relay only, plain HTTP on :8080, no Caddy/TLS.
# Use when the host has no public domain (e.g. an internal VM) — Let's Encrypt
# cannot issue certificates for private IPs. For internet-facing deployments
# use compose.yml (relay + Caddy auto-TLS) instead.
#
#   RELAY_KEY=... docker compose -f compose.lan.yml up -d
# Use RELAY_AUTH_MODE=open to allow public registration without a key.
#
# Put a TLS reverse proxy in front of this stack before using it from a browser
# client. Laptop side then dials: RELAY_URL=wss://<relay-domain>/host
# RELAY_KEY=... npm start
services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    environment:
      RELAY_AUTH_MODE: ${RELAY_AUTH_MODE:-key}
      RELAY_KEY: ${RELAY_KEY:-}
      RELAY_PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped
