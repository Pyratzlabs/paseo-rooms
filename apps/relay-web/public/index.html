  <h1>paseo-rooms</h1>
  <p>This is the collaboration PoC for Paseo agent sessions.</p>
  <p>Create a share link on the host machine:</p>
  <pre>npm run share            # pick from a list of agents
npm run share -- &lt;agent-id&gt;</pre>
  <p>Then open the printed <code>/r/&lt;token&gt;</code> URL in any browser.</p>
