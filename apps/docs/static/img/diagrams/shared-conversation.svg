<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title description">
<title id="title">Bring the team into the conversation</title><desc id="description">Without a room, a host copies an agent conversation to a teammate and relays their reply. With Rooms, the host and teammate both join the same agent conversation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5f92"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#122033}.title{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:650}.copy{font-size:21px}.small{font-size:19px;fill:#506274}.eyebrow{font-size:17px;letter-spacing:2px;font-weight:650;fill:#2b5f92}.edge{fill:none;stroke:#2b5f92;stroke-width:3;marker-end:url(#arrow)}.planned{stroke-dasharray:9 7}</style>
<rect width="1200" height="590" rx="22" fill="#f3f6f8"/>
<text x="44" y="58" class="title">Bring the team into the conversation</text>
<text x="44" y="108" class="eyebrow">THE COPY-AND-PASTE HANDOFF</text><rect x="44" y="135" width="280" height="130" rx="14" fill="#fbfcfd" stroke="#b9cbd9" stroke-width="2"/><text x="66" y="173" class="label">Agent session</text><text x="66" y="207" class="copy">Context stays local</text><rect x="460" y="135" width="280" height="130" rx="14" fill="#fbfcfd" stroke="#b9cbd9" stroke-width="2"/><text x="482" y="173" class="label">Host</text><text x="482" y="207" class="copy">Copy, explain, relay</text><rect x="876" y="135" width="280" height="130" rx="14" fill="#fbfcfd" stroke="#b9cbd9" stroke-width="2"/><text x="898" y="173" class="label">Teammate</text><text x="898" y="207" class="copy">Partial context</text><path d="M 330 200 H 450" class="edge"/><path d="M 746 200 H 866" class="edge"/><text x="44" y="324" class="eyebrow">WITH PASEO ROOMS</text><rect x="44" y="357" width="280" height="145" rx="14" fill="#fbfcfd" stroke="#b9cbd9" stroke-width="2"/><text x="66" y="395" class="label">Host in Paseo</text><text x="66" y="429" class="copy">Same working session</text><rect x="460" y="357" width="280" height="145" rx="14" fill="#e3edf5" stroke="#b9cbd9" stroke-width="2"/><text x="482" y="395" class="label">Shared room</text><text x="482" y="429" class="copy">One conversation</text><text x="482" y="457" class="copy">Live history and replies</text><rect x="876" y="357" width="280" height="145" rx="14" fill="#fbfcfd" stroke="#b9cbd9" stroke-width="2"/><text x="898" y="395" class="label">Teammate</text><text x="898" y="429" class="copy">Join from a browser</text><text x="898" y="457" class="copy">Contribute in context</text><path d="M 330 418 H 450" class="edge"/><path d="M 450 449 H 330" class="edge"/><path d="M 746 418 H 866" class="edge"/><path d="M 866 449 H 746" class="edge"/>
<text x="44" y="567" class="small">Paseo Rooms · Pyratz Labs</text>
</svg>
