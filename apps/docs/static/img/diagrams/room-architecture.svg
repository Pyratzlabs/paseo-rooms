<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title description">
<title id="title">The host keeps the agent connection</title><desc id="description">A trusted static browser client is delivered separately. Browser participants establish encrypted channels through a public relay to the host plugin runtime. The runtime connects to one shared agent through the local Paseo daemon. The host opens its connection to the relay outbound; browser clients receive no daemon credentials.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5f92"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#122033}.title{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:650}.copy{font-size:21px}.small{font-size:19px;fill:#506274}.eyebrow{font-size:17px;letter-spacing:2px;font-weight:650;fill:#2b5f92}.edge{fill:none;stroke:#2b5f92;stroke-width:3;marker-end:url(#arrow)}.planned{stroke-dasharray:9 7}</style>
<rect width="1200" height="790" rx="22" fill="#f3f6f8"/>
<text x="44" y="58" class="title">The host keeps the agent connection</text>
<rect x="34" y="99" width="1132" height="177" rx="18" fill="#e3edf5"/><text x="56" y="130" class="eyebrow">HOST MACHINE · PASEO DAEMON AND PLUGIN</text><rect x="56" y="151" width="310" height="100" rx="14" fill="#fbfcfd" stroke="#b9cbd9" stroke-width="2"/><text x="78" y="189" class="label">Paseo daemon</text><text x="78" y="223" class="copy">Agent, workspace, tools</text><rect x="670" y="151" width="470" height="100" rx="14" fill="#fbfcfd" stroke="#b9cbd9" stroke-width="2"/><text x="692" y="189" class="label">Rooms plugin runtime</text><text x="692" y="223" class="copy">Room → agent mapping and room keys</text><path d="M 374 190 H 660" class="edge"/><path d="M 660 224 H 374" class="edge"/><text x="409" y="171" class="small">Local SDK connection</text><rect x="670" y="365" width="470" height="130" rx="14" fill="#fbfcfd" stroke="#b9cbd9" stroke-width="2"/><text x="692" y="403" class="label">Public relay</text><text x="692" y="437" class="copy">Routes encrypted room records</text><text x="692" y="465" class="copy">No conversation database</text><path d="M 810 262 V 353" class="edge"/><path d="M 920 353 V 262" class="edge"/><text x="44" y="322" class="copy">Host connects outward; no public laptop port.</text><rect x="44" y="591" width="355" height="125" rx="14" fill="#fbfcfd" stroke="#b9cbd9" stroke-width="2"/><text x="66" y="629" class="label">Browser participant A</text><text x="66" y="663" class="copy">Reads, messages, answers</text><rect x="444" y="591" width="355" height="125" rx="14" fill="#fbfcfd" stroke="#b9cbd9" stroke-width="2"/><text x="466" y="629" class="label">Browser participant B</text><text x="466" y="663" class="copy">Same room, separate channel</text><path d="M 230 581 V 542 H 810 V 508" class="edge" marker-start="url(#arrow)"/><path d="M 900 508 V 558 H 620 V 581" class="edge" marker-start="url(#arrow)"/><rect x="44" y="365" width="500" height="130" rx="14" fill="#fbfcfd" stroke="#b9cbd9" stroke-width="2"/><text x="66" y="403" class="label">Static room client</text><text x="66" y="437" class="copy">Default: independently hosted on Pages</text><text x="66" y="465" class="copy">Client origin must be trusted</text><path d="M 100 503 V 578" stroke="#8899a8" stroke-width="2" stroke-dasharray="6 6"/><text x="856" y="632" class="small">Encrypted payloads</text><text x="856" y="662" class="small">Routing metadata visible</text>
<text x="44" y="767" class="small">Paseo Rooms · Pyratz Labs</text>
</svg>
