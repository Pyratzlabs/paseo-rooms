# GitLab CI: typecheck + relay protocol tests on every push; SSH deploy of the
# LAN relay on main when the deploy variables are configured.
#
# Required CI/CD variables for the deploy job (Settings -> CI/CD -> Variables):
#   DEPLOY_SSH_PRIVATE_KEY  file variable (or regular variable) holding the
#                           dedicated deploy key
#   DEPLOY_SSH_KNOWN_HOSTS  pinned SSH host key(s), preferably a file variable
#   DEPLOY_SSH_TARGET       deployer@192.168.193.100
#   RELAY_KEY               shared secret between relay and laptop room servers
# Optional:
#   DEPLOY_REMOTE_DIR       defaults to /home/deployer/paseo-rooms
#   ROOMS_DOMAIN            public domain (e.g. paseo-rooms.pyratzlabs.fr);
#                           when set, the relay joins the host's nginx-proxy
#                           "web" network via compose.proxy.yml for auto-TLS,
#                           otherwise compose.lan.yml (plain :8080) is used
# Without these variables the deploy job simply doesn't appear in the pipeline.
#
# The daemon-dependent suites (e2e, e2e:relay) need a live Paseo daemon and are
# not runnable in CI; run them locally.

stages: [test, deploy]

quality:
  stage: test
  image: node:22-alpine
  tags:
    - paseo-rooms
  script:
    - npm ci --no-audit --no-fund
    - npm run format:check
    - npm run lint
    - npm run typecheck
    - npm run typecheck:web
    - npm run build:web
  artifacts:
    paths:
      - apps/relay-web/public/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

tests:
  stage: test
  image: node:22-alpine
  tags:
    - paseo-rooms
  script:
    - npm ci --no-audit --no-fund
    - npm run build:web
    - npm run test:relay
    - npm run test:relay-client
    - npm run test:name
    - npm run test:scroll
    - npm run test:room-ui
    - npm run test:timeline
    - npm run test:questions
    - npm run test:public-events
    - npm run test:presence
    - npm run test:ci
    - npm run test:lock
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

plugin-verify:
  stage: test
  image: node:22-alpine
  tags:
    - paseo-rooms
  script:
    - npm ci --no-audit --no-fund
    - npm run test:plugin
    - npm run typecheck:plugin
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

deploy:
  stage: deploy
  image: alpine:3.20
  tags:
    - paseo-rooms
  needs:
    - job: quality
      artifacts: true
    - job: tests
      artifacts: false
    - job: plugin-verify
      artifacts: false
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -f "$DEPLOY_SSH_PRIVATE_KEY" ]; then
        cp "$DEPLOY_SSH_PRIVATE_KEY" ~/.ssh/id_deploy
      else
        printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
      fi
      printf '\n' >> ~/.ssh/id_deploy
      chmod 600 ~/.ssh/id_deploy
    - |
      if [ -f "$DEPLOY_SSH_KNOWN_HOSTS" ]; then
        cp "$DEPLOY_SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
      else
        printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      fi
      chmod 600 ~/.ssh/known_hosts
    - printf 'Host *\n  IdentitiesOnly yes\n  IdentityFile ~/.ssh/id_deploy\n' > ~/.ssh/config
  script:
    - |
      DEPLOY_DIR="${DEPLOY_REMOTE_DIR:-/home/deployer/paseo-rooms}"
      if [ -n "${ROOMS_DOMAIN:-}" ]; then
        COMPOSE_FILE="compose.proxy.yml"
        RELAY_ENV_B64="$(printf 'RELAY_KEY=%s\nROOMS_DOMAIN=%s\n' "$RELAY_KEY" "$ROOMS_DOMAIN" | base64 | tr -d '\n')"
      else
        COMPOSE_FILE="compose.lan.yml"
        RELAY_ENV_B64="$(printf 'RELAY_KEY=%s\n' "$RELAY_KEY" | base64 | tr -d '\n')"
      fi
      ssh "$DEPLOY_SSH_TARGET" "mkdir -p '$DEPLOY_DIR/apps/relay-web/deploy' '$DEPLOY_DIR/apps/relay-web/src/relay' '$DEPLOY_DIR/apps/relay-web/public'"
      rsync -az --delete --exclude .env apps/relay-web/deploy/ apps/relay-web/src/relay/ apps/relay-web/public/ --relative \
        "$DEPLOY_SSH_TARGET":"$DEPLOY_DIR/"
      ssh "$DEPLOY_SSH_TARGET" "printf '%s' '$RELAY_ENV_B64' | base64 -d > '$DEPLOY_DIR/apps/relay-web/deploy/.env' && chmod 600 '$DEPLOY_DIR/apps/relay-web/deploy/.env' && cd '$DEPLOY_DIR/apps/relay-web/deploy' && docker compose --env-file .env -f $COMPOSE_FILE up -d --build --remove-orphans && for attempt in \$(seq 1 15); do if curl -sS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi; sleep 1; done; exit 1"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $DEPLOY_SSH_TARGET && $DEPLOY_SSH_PRIVATE_KEY && $DEPLOY_SSH_KNOWN_HOSTS && $RELAY_KEY
